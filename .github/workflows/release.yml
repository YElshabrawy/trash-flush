# Push a tag like v1.2.0 and this builds, tests and publishes
# TrashFlush-1.2.0.dmg as a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build-app.sh numbers builds by commit count

      - name: Test
        run: swift test

      - name: Build the DMG
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/make-dmg.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/TrashFlush-*.dmg build/TrashFlush-*.dmg.sha256 --title "Trash Flush ${GITHUB_REF_NAME#v}" --generate-notes
